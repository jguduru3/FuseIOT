; FuseIoT reference firmware for ESP32 boards (Arduino framework).
;
; Your own board:
;   1. cp include/config.example.h include/config.h   (then edit it)
;   2. pio run -e esp32dev -t upload                   (or esp32-c3-devkitm-1 / esp32-s3-devkitc-1)
;   3. pio device monitor -e esp32dev
;
; Plain `pio run` builds the ci-* environments, which compile every capability
; with the CI-safe defaults in include/config.ci.h (no config.h needed).

[platformio]
default_envs =
    ci-switchable
    ci-dimmable
    ci-rgb_light
    ci-sensor-adc
    ci-sensor-dht22
    ci-lock
    ci-motor
    ci-c3-rgb_light
    ci-s3-switchable

[env]
; espressif32 6.9.0 = Arduino-ESP32 core 2.0.17. The sources also compile
; against core 3.x (Arduino IDE / pioarduino); see src/pwm.h.
platform = espressif32@6.9.0
framework = arduino
lib_deps =
    bblanchon/ArduinoJson@7.2.1
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Warnings for our sources only (not the Arduino core).
build_src_flags =
    -Wall
    -Wextra

; ----------------------------------------------------------------------------
; Real boards: use include/config.h
; ----------------------------------------------------------------------------

[env:esp32dev]
board = esp32dev

[env:esp32-c3-devkitm-1]
board = esp32-c3-devkitm-1
; Native USB-CDC console on most C3 dev boards.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1

; Over-the-air update of an already-flashed device:
;   pio run -e esp32dev-ota -t upload --upload-port <device-id>.local
[env:esp32dev-ota]
extends = env:esp32dev
upload_protocol = espota
; Must match FUSEIOT_OTA_PASSWORD in config.h (leave empty if none).
upload_flags =
    --auth=change-me-ota

; ----------------------------------------------------------------------------
; CI builds: every capability, no user config needed
; ----------------------------------------------------------------------------

[ci]
extends = env:esp32dev
build_flags = -DFUSEIOT_CONFIG_CI

[env:ci-switchable]
extends = ci
build_flags = ${ci.build_flags} -DFUSEIOT_CAPABILITY=FUSEIOT_CAP_SWITCHABLE

[env:ci-dimmable]
extends = ci
build_flags = ${ci.build_flags} -DFUSEIOT_CAPABILITY=FUSEIOT_CAP_DIMMABLE

[env:ci-rgb_light]
extends = ci
build_flags = ${ci.build_flags} -DFUSEIOT_CAPABILITY=FUSEIOT_CAP_RGB_LIGHT

[env:ci-sensor-adc]
extends = ci
build_flags = ${ci.build_flags} -DFUSEIOT_CAPABILITY=FUSEIOT_CAP_SENSOR -DFUSEIOT_SENSOR_SOURCE=FUSEIOT_SENSOR_ADC

[env:ci-sensor-dht22]
extends = ci
build_flags = ${ci.build_flags} -DFUSEIOT_CAPABILITY=FUSEIOT_CAP_SENSOR -DFUSEIOT_SENSOR_SOURCE=FUSEIOT_SENSOR_DHT22

[env:ci-lock]
extends = ci
build_flags = ${ci.build_flags} -DFUSEIOT_CAPABILITY=FUSEIOT_CAP_LOCK

[env:ci-motor]
extends = ci
build_flags = ${ci.build_flags} -DFUSEIOT_CAPABILITY=FUSEIOT_CAP_MOTOR

[env:ci-c3-rgb_light]
extends = env:esp32-c3-devkitm-1
build_flags = ${env:esp32-c3-devkitm-1.build_flags} -DFUSEIOT_CONFIG_CI -DFUSEIOT_CAPABILITY=FUSEIOT_CAP_RGB_LIGHT

[env:ci-s3-switchable]
extends = env:esp32-s3-devkitc-1
build_flags = -DFUSEIOT_CONFIG_CI -DFUSEIOT_CAPABILITY=FUSEIOT_CAP_SWITCHABLE
