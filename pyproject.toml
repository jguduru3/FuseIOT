[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "fuseiot"
dynamic = ["version"]
description = "Deterministic device control SDK for Python: every command confirmed against real device state."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "FuseIoT Team", email = "team@fuseiot.dev"}]
keywords = ["iot", "devices", "automation", "control", "hardware", "mqtt", "http", "home-automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Hardware",
    "Typing :: Typed",
]

dependencies = [
    "structlog>=22.1.0",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "click>=8.0",
    "requests>=2.28",
    "tzdata>=2023.3",  # time zones for schedules on Windows and slim containers
]

[project.optional-dependencies]
async = ["aiohttp>=3.8"]
http = ["aiohttp>=3.8"]
mqtt = ["paho-mqtt>=1.6"]
websocket = ["websockets>=11.0"]
serial = ["pyserial>=3.5"]
redis = ["redis>=4.0"]
discovery = ["zeroconf>=0.47"]
cloud-aws = ["paho-mqtt>=1.6"]
cloud-azure = ["azure-iot-device>=2.12"]
all = [
    "aiohttp>=3.8",
    "paho-mqtt>=1.6",
    "websockets>=11.0",
    "pyserial>=3.5",
    "redis>=4.0",
    "zeroconf>=0.47",
]
test = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "responses>=0.23",
    "requests-mock>=1.11",
]
dev = [
    "fuseiot[all,test]",
    "ruff>=0.5",
    "mypy>=1.8",
    "types-PyYAML",
    "types-requests",
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
fuseiot = "fuseiot.cli.main:main"

[project.urls]
Homepage = "https://github.com/fuseiot/fuseiot"
Documentation = "https://github.com/fuseiot/fuseiot/tree/main/docs"
Repository = "https://github.com/fuseiot/fuseiot.git"
Issues = "https://github.com/fuseiot/fuseiot/issues"
Changelog = "https://github.com/fuseiot/fuseiot/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "fuseiot/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["fuseiot"]

[tool.hatch.build.targets.sdist]
include = ["fuseiot", "tests", "examples", "docs", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "UP006", "UP007", "UP035", "UP045",  # keep typing.Dict/Optional for 3.9 readability
    "S101",                                # assert in tests
    "S104",                                # binding 0.0.0.0 is an explicit, guarded option
    "S311",                                # random is for simulation, not crypto
    "B008", "SIM105", "SIM108", "RUF012", "RUF022",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "SIM", "RUF", "E501"]
"examples/*" = ["S"]
"firmware/*" = ["S"]

[tool.mypy]
python_version = "3.9"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: end-to-end tests using real sockets on 127.0.0.1",
    "slow: slower tests (examples, timeouts)",
]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    "error::pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.coverage.run]
source = ["fuseiot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
